name: Chore
description: Maintenance that users do not see — dependencies, CI, tooling, refactor.
labels: ["type:chore", "status:todo"]
body:
  - type: textarea
    id: change
    attributes:
      label: What to change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Number them AC-1, AC-2, and so on.
      value: |
        - [ ] AC-1:
    validations:
      required: true
